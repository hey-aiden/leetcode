    <body>
        <script>
            /**
             * 723. 粉碎糖果
             * 这个问题是实现一个简单的消除算法
             * 给定一个 m x n 的二维整数数组 board 代表糖果所在的方格，不同的正整数 board[i][j] 代表不同种类的糖果，如果 board[i][j] == 0 代表 (i, j) 这个位置是空的。
             *
             * 给定的方格是玩家移动后的游戏状态，现在需要你根据以下规则粉碎糖果，使得整个方格处于稳定状态并最终输出：
             * 1. 如果有三个及以上水平或者垂直相连的同种糖果，同一时间将它们粉碎，即将这些位置变成空的
             * 2. 在同时粉碎掉这些糖果之后，如果有一个空的位置上方还有糖果，那么上方的糖果就会下落直到碰到下方的糖果或者底部，这些糖果都是同时下落，也不会有新的糖果从顶部出现并落下来
             * 3. 通过前两步的操作，可能又会出现可以粉碎的糖果，请继续重复前面的操作
             * 4. 当不存在可以粉碎的糖果，也就是状态稳定之后，请输出最终的状态
             * 你需要模拟上述规则并使整个方格达到稳定状态，并输出
             * @param {number[][]} board
             * @return {number[][]}
             */
            var candyCrush = function (board) {
                /**
                 * 1. 找到三个及以上、水平或者垂直相连的值相同的糖果； 然后置为0；
                 * 2. 从上往下，填充已经置为0的糖果；
                 */

                const row = board.length
                const col = board[0].length

                // 粉碎糖果函数 - 从下往上，从左往右
                function loopCandy() {
                    let useList = []
                    for (let i = row - 1; i >= 0; i--) {
                        for (let j = 0; j < col; j++) {
                            if (board[i][j] === 0) continue
                            let res = searchCandy(i, j)
                            useList.push(...res)
                        }
                    }
                    setCandy(useList)
                    return useList.length
                }

                function searchCandy(r, c) {
                    let setList = []
                    let baseCandy = board[r][c]
                    // 横向寻找，查找重复项
                    let colCount = 0,
                        right = c + 1
                    while (right < col && board[r][right] === baseCandy) {
                        colCount++
                        right++
                    }

                    // 竖向比较
                    let rowCount = 0,
                        top = r - 1,
                        bottom = r + 1
                    while (top >= 0 && board[top][c] === baseCandy) {
                        top--
                        rowCount++
                    }

                    // 将符合条件的节点置为0 - 先不着急改为0
                    if (rowCount >= 2 || colCount >= 2) {
                        setList.push([r, c])
                        if (colCount >= 2) {
                            let right = c + 1
                            while (colCount > 0) {
                                setList.push([r, right])
                                colCount--
                                right++
                            }
                        }
                        if (rowCount >= 2) {
                            let top = r - 1
                            while (rowCount > 0) {
                                setList.push([top, c])
                                rowCount--
                                top--
                            }
                        }
                        console.log(setList)
                        return setList
                    }
                    return []
                }

                function setCandy(list) {
                    for (const [r, c] of list) {
                        board[r][c] = 0
                    }
                }

                function findCandy() {
                    for (let i = row - 1; i >= 0; i--) {
                        for (let j = 0; j < col; j++) {
                            if (board[i][j] === 0) {
                                moveCandy(i, j)
                            }
                        }
                    }
                }

                // 从上往下填空位
                function moveCandy(r, c) {
                    let top = r - 1
                    while (top >= 0) {
                        if (board[top][c]) {
                            board[r][c] = board[top][c]
                            board[top][c] = 0
                            break
                        }
                        top--
                    }
                }
                while (loopCandy()) {
                    findCandy()
                }
                return board
            }
            candyCrush([
                [2, 1, 3],
                [2, 2, 2],
                [2, 2, 2],
            ])
        </script>
    </body>
